version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - forbidigo
    - gochecknoglobals
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    forbidigo:
      # The library writes no log or other output and never exits the process:
      # it reports through results and errors.
      analyze-types: true
      forbid:
        - pattern: ^log\.
        - pattern: ^os\.(Exit|Stdout|Stderr)$
        - pattern: ^(fmt\.Print.*|print|println)$
    goconst:
      ignore-tests: true
    gocritic:
      disabled-checks:
        - exitAfterDefer
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G501 # Allowed for handling old SNMP security methods.
        - G502 # Allowed for handling old SNMP security methods.
        - G505 # Allowed for handling old SNMP security methods.
    govet:
      enable:
        - shadow
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Table-driven tests repeat structure, and test fixtures convert sizes freely.
      - linters:
          - dupl
          - gochecknoglobals
          - gosec
          - nolintlint
        path: _test.go
      # Tests, examples and the net-snmp oracle may print, log and exit.
      - linters:
          - forbidigo
        path: (_test\.go$|^examples/|^netsnmp/)
      # Explicit declaration types are what the public API tests assert.
      - linters:
          - staticcheck
        path: gosnmp_api_test.go
        text: (ST1023|QF1011)
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/netdata/gosnmp)
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/netdata/gosnmp
