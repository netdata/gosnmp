version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - gochecknoglobals
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    goconst:
      ignore-tests: true
    gocritic:
      disabled-checks:
        - exitAfterDefer
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G501 # Allowed for handling old SNMP security methods.
        - G502 # Allowed for handling old SNMP security methods.
        - G505 # Allowed for handling old SNMP security methods.
    govet:
      enable:
        - shadow
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    # Frozen copy of the library for the differential codec tests; never edited.
    paths:
      - internal/codecref
    rules:
      # Table-driven tests repeat structure, and test fixtures convert sizes freely.
      - linters:
          - dupl
          - gochecknoglobals
          - gosec
          - nolintlint
        path: _test.go
      # Explicit declaration types are what the public API tests assert.
      - linters:
          - staticcheck
        path: gosnmp_api_test.go
        text: (ST1023|QF1011)
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/netdata/gosnmp)
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/netdata/gosnmp
  exclusions:
    paths:
      - internal/codecref
