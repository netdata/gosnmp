---
name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  schedule:
    # Weekly run so new vulnerabilities and toolchain regressions surface without a PR.
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gosnmp
            dir: .
            args: --build-tags=end2end
          - name: gosnmp_nopwdcache
            dir: .
            args: --build-tags=gosnmp_nopwdcache
          - name: netsnmp
            dir: netsnmp
            args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: ${{ matrix.dir }}
          args: ${{ matrix.args }}
      - name: Check license headers
        if: matrix.name == 'gosnmp'
        run: make check_license

  generate:
    name: Generated code and go.mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Regenerate code
        run: go generate ./...
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy -diff
          (cd netsnmp && go mod tidy -diff)
          (cd tools && go mod tidy -diff)
      - name: Check for uncommitted changes
        run: git status --porcelain && test -z "$(git status --porcelain)"

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: govulncheck
        run: make vulncheck

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The platforms the Netdata Agent builds its Go plugins for.
        include:
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: windows, goarch: amd64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Build
        run: go build ./...
      - name: Vet, including tests
        run: |
          go vet -tags end2end ./...
          (cd netsnmp && go vet ./...)

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux/amd64, os: ubuntu-latest, goarch: amd64, flags: -race }
          - { name: linux/386, os: ubuntu-latest, goarch: "386", flags: "" }
          - { name: macos, os: macos-latest, goarch: "", flags: "" }
          - { name: windows, os: windows-latest, goarch: "", flags: "" }
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Unit tests
        run: go test -v ${{ matrix.flags }} ./...
      - name: netsnmp tests (playback)
        working-directory: netsnmp
        run: go test -v ./...
      - name: Unit tests (gosnmp_nopwdcache)
        if: matrix.name == 'linux/amd64'
        run: go test -tags gosnmp_nopwdcache ./...

  e2e:
    name: End-to-end (net-snmp agent, ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, flags: -race }
          - { goarch: "386", flags: "" }
    env:
      GOARCH: ${{ matrix.goarch }}
      GOSNMP_TARGET: "127.0.0.1"
      GOSNMP_PORT: "161"
      GOSNMP_TARGET_IPV4: "127.0.0.1"
      GOSNMP_PORT_IPV4: "161"
      GOSNMP_TARGET_IPV6: "::1"
      GOSNMP_PORT_IPV6: "161"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Start snmpd with the test users
        run: |
          sudo apt-get update
          sudo apt-get -y install snmpd
          sudo ./snmp_users.sh
          sudo sed -i -e 's/^agentaddress.*$/agentaddress 127.0.0.1/' /etc/snmp/snmpd.conf
          sudo service snmpd restart
      - name: End-to-end tests
        run: go test -v ${{ matrix.flags }} -tags end2end ./...

  net-snmp:
    name: Compare with net-snmp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Install libsnmp
        run: sudo apt-get -y install libsnmp-dev
      - name: Compare decoding with libnetsnmp
        run: make -C netsnmp test_netsnmp

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Fuzz Unmarshal
        run: go test -fuzztime 60s -v -run '^FuzzUnmarshal$' -fuzz '^FuzzUnmarshal$'
      - name: Fuzz DecodeReencode
        run: go test -fuzztime 60s -v -run '^FuzzDecodeReencode$' -fuzz '^FuzzDecodeReencode$'
      - name: Fuzz DecodeV3
        run: go test -fuzztime 60s -v -run '^FuzzDecodeV3$' -fuzz '^FuzzDecodeV3$'
